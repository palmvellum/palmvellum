<?xml version="1.0" encoding="UTF-8"?>
<!-- PalmVellum Sync on Mac app icon. Same silver-desk tile family as the
     organizer icon, but the hero is a Palm-orange circular two-arrow HotSync
     ring (Palm ⇄ cloud) wrapped around a small cream vellum card. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECECE7"/>
      <stop offset="1" stop-color="#C2C4BE"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFAF4"/>
      <stop offset="1" stop-color="#ECEADE"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4892F"/>
      <stop offset="1" stop-color="#C9531A"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#2B2B28" flood-opacity="0.34"/>
    </filter>
    <filter id="ringShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7A3410" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded silver tile. -->
  <g filter="url(#tileShadow)">
    <rect x="100" y="86" width="824" height="824" rx="185" ry="185" fill="url(#desk)"/>
  </g>
  <rect x="100" y="86" width="824" height="824" rx="185" ry="185" fill="url(#glow)"/>

  <!-- Small vellum card behind the ring (PalmVellum identity hint). -->
  <g transform="translate(512,512)">
    <rect x="-120" y="-150" width="240" height="300" rx="22" fill="url(#card)" stroke="#C9C7B8" stroke-width="2"/>
    <path d="M84,150 L120,114 L120,150 Z" fill="#DAD7C8"/>
    <g fill="#E79A66" fill-opacity="0.85">
      <rect x="-86" y="-104" width="150" height="10" rx="5"/>
      <rect x="-86" y="-64" width="150" height="10" rx="5"/>
      <rect x="-86" y="-24" width="120" height="10" rx="5"/>
    </g>
  </g>

  <!-- HotSync ring: two orange arcs + arrowheads, around the card. -->
  <g filter="url(#ringShadow)">
    <!-- Top arc: just-below-west → over the top → just-below-east. -->
    <path d="M 345,482 A 170,170 0 0 1 679,482"
          fill="none" stroke="url(#ring)" stroke-width="54" stroke-linecap="round"/>
    <!-- Bottom arc: just-below-east → under the bottom → just-below-west. -->
    <path d="M 679,542 A 170,170 0 0 1 345,542"
          fill="none" stroke="url(#ring)" stroke-width="54" stroke-linecap="round"/>
    <!-- Arrowhead at top-arc end (right side), pointing down. -->
    <path d="M 679,430 L 727,486 L 631,486 Z" fill="url(#ring)"/>
    <!-- Arrowhead at bottom-arc end (left side), pointing up. -->
    <path d="M 345,594 L 297,538 L 393,538 Z" fill="url(#ring)"/>
  </g>

  <!-- Glassy top sheen. -->
  <rect x="100" y="86" width="824" height="412" rx="185" ry="185" fill="url(#sheen)"/>
</svg>
